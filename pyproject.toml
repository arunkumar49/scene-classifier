[project]
name = "scene-classifier"
version = "0.1.0"
description = "PyTorch image scene classifier with SageMaker training and MLflow tracking"
readme = "README.md"
authors = [
    { name = "Arun Kumar", email = "" }
]
requires-python = ">=3.11"
dependencies = [
    "ruff>=0.17.1",
]

[project.scripts]
scene-classifier = "scene_classifier:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
