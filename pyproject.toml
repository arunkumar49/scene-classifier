[project]
name = "scene-classifier"
version = "0.1.0"
description = "PyTorch image scene classifier with SageMaker training and MLflow tracking"
readme = "README.md"
authors = [
    { name = "Arun Kumar", email = "" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.116",
    "datasets[vision]>=5.1.0",
    "hydra-core>=1.3.7",
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[project.scripts]
scene-classifier = "scene_classifier:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.116",
    "botocore[crt]>=1.43.116",
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "lightning>=2.6.6",
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
